<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="gal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="gal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>
  </defs>

  <circle cx="300" cy="200" r="140" fill="url(#gal-grad)" filter="url(#gal-glow)" opacity="0.35"/>

  <!-- Constellation Nodes & Pathway -->
  <path d="M120 280 Q200 120 300 200 T480 120" stroke="url(#gal-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <circle cx="120" cy="280" r="12" fill="#f472b6"/>
  <circle cx="210" cy="180" r="14" fill="#a855f7"/>
  <circle cx="300" cy="200" r="16" fill="#6366f1"/>
  <circle cx="400" cy="150" r="18" fill="#38bdf8"/>
  <circle cx="480" cy="120" r="22" fill="#34d399"/>

  <!-- Star Nodes -->
  <polygon points="480,90 484,110 500,114 484,118 480,138 476,118 460,114 476,110" fill="#ffffff"/>
</svg>
