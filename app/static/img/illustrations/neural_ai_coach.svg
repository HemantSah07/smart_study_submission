<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="ai-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <circle cx="300" cy="200" r="140" fill="url(#ai-grad)" filter="url(#ai-blur)" opacity="0.45"/>
  
  <circle cx="300" cy="200" r="110" stroke="url(#ai-grad)" stroke-width="2" stroke-dasharray="6 10" opacity="0.5"/>
  <circle cx="300" cy="200" r="75" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>

  <circle cx="300" cy="200" r="42" fill="url(#ai-grad)"/>
  
  <!-- Robot Eye / Core Pulse -->
  <circle cx="286" cy="194" r="6" fill="#ffffff"/>
  <circle cx="314" cy="194" r="6" fill="#ffffff"/>
  <path d="M290 212 C295 218, 305 218, 310 212" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neural Sparks -->
  <circle cx="180" cy="120" r="8" fill="#a855f7" opacity="0.8"/>
  <circle cx="430" cy="110" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="450" cy="280" r="9" fill="#6366f1" opacity="0.8"/>
  <circle cx="160" cy="290" r="7" fill="#38bdf8" opacity="0.8"/>

  <line x1="300" y1="200" x2="180" y2="120" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="300" y1="200" x2="430" y2="110" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="300" y1="200" x2="450" y2="280" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="300" y1="200" x2="160" y2="290" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
