<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <circle cx="400" cy="250" r="180" fill="url(#grad-glow)" filter="url(#blur-glow)" opacity="0.6"/>
  <circle cx="200" cy="150" r="100" fill="#38bdf8" filter="url(#blur-glow)" opacity="0.25"/>
  <circle cx="600" cy="350" r="120" fill="#a855f7" filter="url(#blur-glow)" opacity="0.25"/>

  <circle cx="400" cy="250" r="220" stroke="url(#grad-main)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.35"/>
  <circle cx="400" cy="250" r="160" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  <circle cx="400" cy="250" r="100" stroke="#a855f7" stroke-width="2" opacity="0.4"/>

  <circle cx="400" cy="250" r="48" fill="url(#grad-main)"/>
  <path d="M400 226L424 238L400 250L376 238L400 226Z" fill="#ffffff"/>
  <path d="M382 245V258C382 262 390 266 400 266C410 266 418 262 418 258V245" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(240, 160)">
    <rect x="-30" y="-20" width="60" height="40" rx="10" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="5" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AI</text>
  </g>

  <g transform="translate(560, 160)">
    <rect x="-35" y="-20" width="70" height="40" rx="10" fill="rgba(15,23,42,0.85)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="5" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">STREAK</text>
  </g>

  <g transform="translate(540, 340)">
    <rect x="-35" y="-20" width="70" height="40" rx="10" fill="rgba(15,23,42,0.85)" stroke="#34d399" stroke-width="1.5"/>
    <text x="0" y="5" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SCORE</text>
  </g>

  <g transform="translate(260, 340)">
    <rect x="-30" y="-20" width="60" height="40" rx="10" fill="rgba(15,23,42,0.85)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="5" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PLAN</text>
  </g>

  <line x1="400" y1="250" x2="240" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="400" y1="250" x2="560" y2="160" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="400" y1="250" x2="540" y2="340" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="400" y1="250" x2="260" y2="340" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
