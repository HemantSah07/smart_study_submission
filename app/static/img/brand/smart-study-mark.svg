<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ss-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background glow circle -->
  <circle cx="50" cy="50" r="42" fill="url(#ss-glow-grad)" opacity="0.15" />

  <!-- Neural Connection Nodes & Paths -->
  <path d="M 28 32 C 38 18, 62 18, 72 32 C 80 43, 68 55, 50 56 C 32 57, 20 68, 28 80 C 38 92, 62 92, 72 80" 
        fill="none" stroke="url(#ss-mark-grad)" stroke-width="8" stroke-linecap="round" filter="url(#ss-glow)" />

  <!-- Open Book Base Accent -->
  <path d="M 24 72 Q 50 64 50 82 Q 50 64 76 72" 
        fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brain / Neural Nodes -->
  <circle cx="28" cy="32" r="4.5" fill="#38bdf8" />
  <circle cx="72" cy="32" r="4.5" fill="#818cf8" />
  <circle cx="50" cy="56" r="5" fill="#c084fc" />
  <circle cx="28" cy="80" r="4.5" fill="#38bdf8" />
  <circle cx="72" cy="80" r="4.5" fill="#a855f7" />
</svg>
