<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="ss-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mark Icon -->
  <g transform="translate(4, 6) scale(0.48)">
    <path d="M 28 32 C 38 18, 62 18, 72 32 C 80 43, 68 55, 50 56 C 32 57, 20 68, 28 80 C 38 92, 62 92, 72 80" 
          fill="none" stroke="url(#ss-logo-grad)" stroke-width="8" stroke-linecap="round" filter="url(#ss-logo-glow)" />
    <path d="M 24 72 Q 50 64 50 82 Q 50 64 76 72" 
          fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="28" cy="32" r="4.5" fill="#38bdf8" />
    <circle cx="72" cy="32" r="4.5" fill="#818cf8" />
    <circle cx="50" cy="56" r="5" fill="#c084fc" />
    <circle cx="28" cy="80" r="4.5" fill="#38bdf8" />
    <circle cx="72" cy="80" r="4.5" fill="#a855f7" />
  </g>

  <!-- Typography -->
  <text x="62" y="32" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.02em">SMART <tspan fill="url(#ss-logo-grad)">STUDY</tspan></text>
  <text x="62.5" y="46" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" fill="#94a3b8" letter-spacing="0.16em">AI-POWERED ACADEMIC PLATFORM</text>
</svg>
